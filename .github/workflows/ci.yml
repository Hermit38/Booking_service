name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

# минимум прав (безопасность)
permissions:
  contents: read

# отменять устаревшие прогоны в той же ветке
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # не «висеть» 360 мин по умолчанию

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ci_process
          POSTGRES_USER: ci_process
          POSTGRES_PASSWORD: ci_process
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci_process -d ci_process"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-do-not-use-in-prod-0123456789abcdef
      POSTGRES_DB: ci_process
      POSTGRES_USER: ci_process
      POSTGRES_PASSWORD: ci_process
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip + poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: ${{ runner.os }}-pip-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-poetry-

      - name: Install Poetry
        run: pip install "poetry==2.5.1"

      - name: Install dependencies
        run: poetry install --no-root --with dev

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Ruff (format check)
        run: poetry run ruff format --check .

      - name: Mypy (type check)
        run: poetry run mypy src

      - name: Pytest
        run: poetry run pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (without push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: booking-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max