[project]
name = "booking-service"
version = "0.1.0"
description = "Service booking hotels"
authors = [
    {name = "Boris",email = "bsuhorukov97@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "mypy (>=1.13,<2.4)",
    "django-stubs (>=6.1.2,<7.0.0)",
    "djangorestframework-stubs (>=3.18.1,<4.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# Говорим pytest, что исходники лежат в src:
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313" 
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
plugins = [
    "pydantic.mypy",
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
strict = true
show_error_codes = true
warn_unused_ignores = true
explicit_package_bases = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
