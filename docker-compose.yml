services:
  db:
    image: postgres:17-alpine
    container_name: booking_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: booking_api
    restart: unless-stopped
    env_file:
      - .env                       
    environment:
      POSTGRES_HOST: db           
      POSTGRES_PORT: 5432          
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs     # логи контейнера пишутся в локальную папку ./logs
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]  # Встроенная быстрая проверка Django на ошибки конфигурации
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata: